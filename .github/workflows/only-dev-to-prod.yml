name: Production Branch Protection

on:
  pull_request:
    branches:
      - production

jobs:
  check-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        run: |
          if [[ "${GITHUB_HEAD_REF}" != "development" ]]; then
            echo "❌ Error: Pull request into '${GITHUB_BASE_REF}' must come from 'development' branch"
            exit 1
          fi